###############################################################################
# Backend and infrastructure pipeline
#
# test  ->  scan  ->  plan  ->  apply (gated)
#
# Authentication is OpenID Connect end to end. There is not a single
# AWS_ACCESS_KEY_ID in this repository. Each job exchanges the run's signed
# GitHub token for a one hour STS session, and the plan job assumes a read
# only role while the apply job assumes a write role. A pull request can
# therefore never mutate the account, even if someone edits the workflow in
# that pull request.
#
# The manual approval gate is the production GitHub environment. Configure it
# once under Settings, Environments, production, Required reviewers. Without
# that setting this pipeline applies without asking.
###############################################################################

name: backend deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "terraform/**"
      - ".github/workflows/backend-deploy.yml"
  pull_request:
    paths:
      - "backend/**"
      - "terraform/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

# Never let two applies race for the same state lock.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

# id-token is what makes OIDC possible. Without it the federated assume role
# call fails with an invalid identity token error.
permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PYTHON_VERSION: "3.11"
  TERRAFORM_VERSION: "1.15.8"
  TF_WORKING_DIR: terraform/environments/prod
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_state_lock_table_name: ${{ vars.TF_LOCK_TABLE }}

jobs:
  # ---------------------------------------------------------------------- test
  test:
    name: unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: lint
        working-directory: backend
        run: ruff check src tests

      - name: run pytest with coverage
        working-directory: backend
        run: |
          pytest \
            --cov=visitor_counter \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------- scan
  scan:
    name: static analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform format check
        run: terraform fmt -check -recursive terraform

      - name: checkov policy scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: true
          output_format: cli

  # ---------------------------------------------------------------------- plan
  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    needs: [test, scan]

    steps:
      - uses: actions/checkout@v4

      - name: assume the read only plan role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-terraform-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      - name: validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate -no-color

      - name: plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -no-color -lock-timeout=120s -out=tfplan | tee plan.txt
          echo "### Terraform plan" >> "$GITHUB_STEP_SUMMARY"
          echo '```terraform' >> "$GITHUB_STEP_SUMMARY"
          tail -c 60000 plan.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: comment the plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan.txt', 'utf8');
            const clipped = plan.length > 60000 ? plan.slice(-60000) : plan;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ['#### Terraform plan', '```terraform', clipped, '```'].join('\n'),
            });

      - name: upload the plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5
          if-no-files-found: error

  # --------------------------------------------------------------------- apply
  apply:
    name: terraform apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    # This is the manual gate. The job pauses here until a required reviewer
    # approves the run in the GitHub UI. The apply role is also only trusted
    # for this environment claim, so the credentials do not exist before the
    # approval happens.
    environment:
      name: production
      url: ${{ steps.outputs.outputs.site_url }}

    steps:
      - uses: actions/checkout@v4

      - name: assume the write role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-terraform-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      - name: download the approved plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      # Applying the saved plan file, not re-planning. What the reviewer
      # approved is exactly what runs.
      - name: apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -no-color -lock-timeout=120s -auto-approve tfplan

      - name: publish outputs
        id: outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "site_url=$(terraform output -raw site_url)" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed"
            echo ""
            echo "| output | value |"
            echo "| --- | --- |"
            echo "| site | $(terraform output -raw site_url) |"
            echo "| api | $(terraform output -raw counter_url) |"
            echo "| table | $(terraform output -raw dynamodb_table_name) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: smoke test the counter
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          COUNTER_URL="$(terraform output -raw counter_url)"
          SITE_URL="$(terraform output -raw site_url)"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Origin: ${SITE_URL}" "${COUNTER_URL}")
          echo "GET ${COUNTER_URL} returned ${STATUS}"
          test "${STATUS}" = "200"
